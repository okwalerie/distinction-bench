name: publish sealed static gallery

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag whose sealed bundle asset should be published
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra site
      - name: download sealed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern "distinction-bench-$RELEASE_TAG.tar.gz"
      - name: unpack and validate the sealed bundle
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir release
          tar -xzf "distinction-bench-$RELEASE_TAG.tar.gz" -C release
          uv run python -c 'from pathlib import Path; from dbench.publication import open_release; b=open_release(Path("release")); p=b.publication(); assert p.status == "sealed"'
      - name: rebuild and verify sealed site bytes
        run: >-
          uv run python -c 'from pathlib import Path; from dbench.publication import
          open_release; from lofsite.build import build_site, verify_site_tree;
          p=open_release(Path("release")).publication(); build_site(p,
          Path("dist/site")); verify_site_tree(Path("release/site"), Path("dist/site"))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
